# Production Configuration

# MySQL Configuration (배포 시)
spring.datasource.url=jdbc:mysql://db:3306/feeldb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Configuration (배포 시 대안)
# spring.datasource.url=jdbc:postgresql://postgres:5432/feeldb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable H2 Console in Production
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Base URL for file URLs (환경변수로 주입, 기본값: 로컬)
app.base-url=${APP_BASE_URL:https://engsc.jbnu.ac.kr}

# Admin seed — 비밀번호 기본값 없음. ADMIN_PASSWORD 미설정 시 시드 스킵
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# JWT — 운영에서는 JWT_SECRET 필수 (로컬 기본값 사용 금지)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth Client ID (프론트엔드와 동일). 미설정 시 aud 검증 생략되므로 반드시 설정
app.google.client-id=${APP_GOOGLE_CLIENT_ID}

# JSON 날짜 직렬화: LocalDate를 ISO 문자열(yyyy-MM-dd)로 전송
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging for Production
logging.level.root=INFO
logging.level.com.feel.backend=INFO
