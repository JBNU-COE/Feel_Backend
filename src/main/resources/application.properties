# Server Configuration
server.port=8080

# JSON 날짜 직렬화: LocalDate/LocalDateTime을 배열이 아닌 ISO 문자열로 전송 (user-front 행사일 등)
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# H2 Database Configuration (로컬 개발 환경)
spring.datasource.url=jdbc:h2:file:./data/feeldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false



# JWT (앱 로그인 토큰). 운영에서는 JWT_SECRET 환경변수로 덮어씀 (32자 이상 권장)
jwt.secret=${JWT_SECRET:feel-local-dev-jwt-secret-key-change-me!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin seed (기동 시 계정이 없을 때만 생성, DB에는 BCrypt 해시만 저장)
# 로컬: ADMIN_USERNAME / ADMIN_PASSWORD 미설정 시 시드 스킵
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Google OAuth (JBNU 웹메일 @jbnu.ac.kr 로그인용)
# Google Cloud Console OAuth 2.0 클라이언트 ID. 프론트엔드 Client ID와 동일해야 함
# 비어있으면 aud 검증 생략 (로컬만). 배포 시 반드시 GOOGLE_CLIENT_ID 설정
app.google.client-id=${GOOGLE_CLIENT_ID:}

# H2 Console (로컬 개발 환경)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
